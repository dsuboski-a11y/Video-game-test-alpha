<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EISENKRIEG</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="Carry-and-command real-time strategy, built for the phone." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="EISENKRIEG" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #05070d;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #cfe3ff;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="ui"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

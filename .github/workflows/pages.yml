# Publishes the game to GitHub Pages so it can be opened from a phone by link.
#
# No setup required: configure-pages is asked to enable Pages itself. If that
# is blocked by org policy, a repo admin can do it by hand under
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [claude/herzog-zwei-iphone-fmuiev, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Playwright is a dev dependency used only by the test harnesses; the
      # deploy does not need its browsers, and downloading them is ~300 MB.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # `npm run single` runs the production build and then folds it into one
      # self-contained file, so the deploy carries both the normal site and a
      # standalone copy at /eisenkrieg.html.
      - run: npm run single
      # enablement turns Pages on via the API, so nobody has to find the
      # setting by hand. It needs the pages:write permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
